name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 单元测试不依赖 MySQL / Redis / RocketMQ，所以在 CI 里可以直接跑
      - name: 编译并运行单元测试
        working-directory: server
        run: mvn -B test
