services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: offermate-mysql
    ports:
      # 宿主机映射到 13306（容器内仍是 3306），避免与本机可能已存在的 MySQL 冲突
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: offermate
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Windows 上 bind mount 进来的文件权限一律是 777，而 MySQL 会打印
    # "World-writable config file ... is ignored" 并**完全忽略**它（:ro 也拦不住：
    # 777 是文件本身的权限，不是可写性）。而 :ro 挂载又 chmod 不动（read-only file system），
    # 所以拿不到"既能只读挂载、权限又是 0644"的文件 —— 只能挂到旁路路径，
    # 在官方 entrypoint 读配置之前复制一份 0644 的进去。
    entrypoint:
      - /bin/sh
      - -c
      - |
        install -m 0644 /opt/offermate/mysql-client.cnf /etc/mysql/conf.d/charset.cnf
        exec docker-entrypoint.sh "$$@"
      - --
    volumes:
      # 用 Docker 数据卷（不用挂载本机目录）：Windows 上挂载目录要穿过虚拟机，磁盘 IO 最慢
      - mysql-data:/var/lib/mysql
      # 逐个挂载并加数字前缀：容器按文件名字母序执行，直接挂目录会让 data.sql 跑在 schema.sql 前面
      - ./server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql
      # 客户端字符集：初始化脚本由容器内的 mysql 客户端执行，它默认按 latin1 读 SQL 文件，
      # 中文种子数据会被二次编码成乱码（详见 README「初始化配置与数据卷」）。
      # 挂到旁路路径（不是 /etc/mysql/conf.d），由上面的 entrypoint 复制成 0644 后再用。
      - ./deploy/mysql-client.cnf:/opt/offermate/mysql-client.cnf:ro

  redis:
    image: redis:7.2
    restart: unless-stopped
    container_name: offermate-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123456
    volumes:
      - redis-data:/data

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    restart: unless-stopped
    container_name: offermate-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    restart: unless-stopped
    container_name: offermate-broker
    # 数据卷默认属于 root，而 RocketMQ 默认以 rocketmq 用户运行 → 会写不进存储目录导致启动失败
    user: root
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -c /home/rocketmq/broker.conf
    volumes:
      - ./deploy/broker.conf:/home/rocketmq/broker.conf
      - rocketmq-store:/home/rocketmq/store

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    restart: unless-stopped
    container_name: offermate-dashboard
    depends_on:
      - rocketmq-namesrv
    ports:
      - "8180:8080"
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"

  # MinIO：官方镜像 minio/minio 已从 Docker Hub 下架，所以默认不启动（不影响投递链路的压测）。
  # 需要演示上传功能时再执行：docker compose --profile minio up -d
  minio:
    image: docker.m.daocloud.io/bitnamilegacy/minio:latest
    restart: unless-stopped
    container_name: offermate-minio
    profiles: ["minio"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/bitnami/minio/data

  # 应用本体：默认不启动。一条命令跑全栈（中间件 + 后端）：
  #   docker compose --profile app --profile minio up -d --build
  # 配置全部走环境变量（application.yml 里每一项都有本地默认值），容器之间用服务名互联
  app:
    profiles: ["app"]
    build:
      context: ./server
    container_name: offermate-app
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - rocketmq-namesrv
      - rocketmq-broker
    ports:
      - "18080:18080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_PASSWORD: root123456
      REDIS_HOST: redis
      REDIS_PASSWORD: redis123456
      ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # 大模型 Key 从宿主机环境变量透传，没配也能启动（AI 接口降级返回提示语）
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-Qwen/Qwen2.5-7B-Instruct}

# 数据都放在 Docker 数据卷里（比挂载 Windows 目录快很多），删掉数据卷就等于清空重来
volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
  minio-data:
